<title>Acme Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F8FAFD; --sidebar:#131C2E; --sidebar-2:#1B2740;
  --sidebar-text:#9DAAC4; --sidebar-active:#2F6BFF;
  --ink:#0F1729; --ink-2:#4A5670; --muted:#7A88A3; --line:#E6EBF3; --line-2:#EEF2F8;
  --accent:#2F6BFF; --accent-soft:#E7EEFF; --accent-ink:#1A4FD0;
  --good:#16A34A; --good-soft:#E3F5EA; --warn:#E08600; --warn-soft:#FCEFD6;
  --bad:#E23D3D; --bad-soft:#FBE4E4; --slate:#5B6B8C; --slate-soft:#EAEEF6;
  --violet:#6D3BD6; --violet-soft:#EDE7FB; --cyan:#0E9AB0;
  --shadow:0 1px 2px rgba(19,28,46,.04),0 8px 24px rgba(19,28,46,.06);
  --shadow-lg:0 12px 40px rgba(19,28,46,.14);
  --r:14px; --r-sm:10px;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --bg:#0B1120; --surface:#121A2B; --surface-2:#0F1626; --sidebar:#0A101E; --sidebar-2:#141E33;
  --sidebar-text:#8595B4; --ink:#EAF0FB; --ink-2:#AEB9D2; --muted:#7E8CA8; --line:#243149; --line-2:#1C2740;
  --accent:#4E82FF; --accent-soft:#17233F; --accent-ink:#9DBBFF;
  --good:#37C871; --good-soft:#13301F; --warn:#F0A62E; --warn-soft:#33260E; --bad:#F0605F; --bad-soft:#33161A;
  --slate:#9AA9C6; --slate-soft:#1B2740; --violet:#B79BF5; --violet-soft:#241A3D; --cyan:#3FC6D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#121A2B; --surface-2:#0F1626; --sidebar:#0A101E; --sidebar-2:#141E33;
  --sidebar-text:#8595B4; --ink:#EAF0FB; --ink-2:#AEB9D2; --muted:#7E8CA8; --line:#243149; --line-2:#1C2740;
  --accent:#4E82FF; --accent-soft:#17233F; --accent-ink:#9DBBFF;
  --good:#37C871; --good-soft:#13301F; --warn:#F0A62E; --warn-soft:#33260E; --bad:#F0605F; --bad-soft:#33161A;
  --slate:#9AA9C6; --slate-soft:#1B2740; --violet:#B79BF5; --violet-soft:#241A3D; --cyan:#3FC6D8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid var(--bg)}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;padding:20px 14px;gap:6px;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px;color:#fff}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2F6BFF,#5A8BFF);
  display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.4)}
.brand .name{font-weight:800;font-size:16px;letter-spacing:-.2px;line-height:1.1}
.brand .name small{display:block;font-weight:500;font-size:10.5px;color:var(--sidebar-text);letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#5C6B8C;padding:12px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--sidebar-text);
  text-decoration:none;font-weight:500;font-size:13.5px;transition:.15s}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:var(--sidebar-2);color:#fff}
.nav a.active{background:var(--sidebar-active);color:#fff;box-shadow:0 6px 16px rgba(47,107,255,.35)}
.nav a.active svg{opacity:1}
.nav a .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.13);padding:1px 8px;border-radius:20px;font-weight:600}
.nav a.active .count{background:rgba(255,255,255,.22)}
.side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--sidebar-2);font-size:12px}
.side-foot .who{display:flex;align-items:center;gap:10px}
.side-foot .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF7A3B);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.side-foot .who b{color:#fff;font-size:13px;display:block;font-weight:600}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:12px 26px}
.hamb{display:none;background:none;border:1px solid var(--line);border-radius:9px;width:38px;height:38px;
  color:var(--ink);align-items:center;justify-content:center}
.search{flex:1;max-width:440px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
  padding:10px 14px 10px 38px;font-family:inherit;font-size:13.5px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);display:grid;place-items:center;position:relative}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.pill-user{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--line);
  border-radius:30px;background:var(--surface)}
.pill-user .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#EF7A3B);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.pill-user b{font-size:13px;font-weight:600}.pill-user span{font-size:11px;color:var(--muted);display:block;line-height:1}

.content{padding:24px 26px 48px;max-width:1300px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.4px}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.kpi .k-top{display:flex;align-items:center;gap:10px}
.kpi .k-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.kpi .k-ico svg{width:19px;height:19px}
.kpi .k-lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .k-num{font-size:28px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1}
.kpi .k-sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.kpi .k-sub b{color:var(--good);font-weight:700}
.i-blue{background:var(--accent-soft);color:var(--accent)}
.i-green{background:var(--good-soft);color:var(--good)}
.i-amber{background:var(--warn-soft);color:var(--warn)}
.i-slate{background:var(--slate-soft);color:var(--slate)}
.i-violet{background:var(--violet-soft);color:var(--violet)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tabs-row{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.tab{border:none;background:none;padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.tab .c{color:var(--muted);font-weight:600;margin-left:5px;font-size:12px}
.tab:hover{background:var(--surface-2)}
.tab.active{background:var(--accent);color:#fff}
.tab.active .c{color:rgba(255,255,255,.75)}
.tabs-row .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink);color:#fff}

/* source filter */
.filter-bar{display:flex;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.filter-bar .fl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 12px;border-radius:20px;
  font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .dt{width:8px;height:8px;border-radius:50%}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.active .dt{outline:2px solid rgba(255,255,255,.4)}
.chip-clear{margin-left:auto;color:var(--bad);border-color:transparent;background:none}
.chip-clear:hover{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line-2);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--line-2);transition:.12s;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td{padding:13px 16px;vertical-align:middle}
.lead-cell{display:flex;align-items:center;gap:12px}
.av-lead{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.lead-name{font-weight:700;font-size:13.5px}
.lead-sub{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:1px;flex-wrap:wrap}
.brand-tag{font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;letter-spacing:.2px}
.bt-a{background:var(--accent-soft);color:var(--accent-ink)}
.bt-b{background:var(--violet-soft);color:var(--violet)}
.src-tag{font-size:10.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.src-tag .dt{width:7px;height:7px;border-radius:50%}
.contact{font-size:12.5px;color:var(--ink-2)}
.contact .row{display:flex;align-items:center;gap:7px;white-space:nowrap}
.contact .row svg{width:13px;height:13px;color:var(--muted)}
.req{font-size:12.5px;color:var(--ink-2);max-width:200px}
.prog{display:flex;align-items:center;gap:9px;min-width:120px}
.prog .bar{flex:1;height:6px;border-radius:20px;background:var(--line);overflow:hidden}
.prog .fill{height:100%;border-radius:20px}
.prog b{font-size:12px;font-variant-numeric:tabular-nums;width:34px;text-align:right}
.status{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.status .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.s-new{background:var(--accent-soft);color:var(--accent-ink)}
.s-contacted{background:var(--slate-soft);color:var(--slate)}
.s-interested{background:var(--good-soft);color:var(--good)}
.s-follow{background:var(--warn-soft);color:var(--warn)}
.s-na{background:var(--line-2);color:var(--muted)}
.s-lost{background:var(--bad-soft);color:var(--bad)}
.s-won{background:var(--good-soft);color:var(--good)}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted);flex-wrap:wrap;gap:10px}
.pager{display:flex;align-items:center;gap:4px}
.pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600}
.pager button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---------- DASHBOARD ---------- */
.dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:18px}
.dash-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.chart-card{padding:20px}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.chart-head h3{margin:0;font-size:15px;font-weight:700}
.chart-head .sub{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:9px;padding:3px}
.seg button{border:none;background:none;padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* source bars */
.sbar{display:flex;flex-direction:column;gap:14px}
.sbar .row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:12px}
.sbar .nm{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.sbar .nm .dt{width:9px;height:9px;border-radius:3px;flex:none}
.sbar .track{height:10px;background:var(--line-2);border-radius:20px;overflow:hidden}
.sbar .fill{height:100%;border-radius:20px}
.sbar .vl{font-size:12.5px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
/* donut */
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-legend{display:flex;flex-direction:column;gap:11px;flex:1}
.donut-legend .li{display:flex;align-items:center;gap:9px;font-size:12.5px}
.donut-legend .li .dt{width:10px;height:10px;border-radius:3px}
.donut-legend .li b{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.donut-legend .li span{color:var(--muted);font-size:11px}
/* pipeline funnel */
.funnel{display:flex;flex-direction:column;gap:9px}
.funnel .fr{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:12px}
.funnel .fl-lbl{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.funnel .fl-lbl .d{width:8px;height:8px;border-radius:50%}
.funnel .fbar{height:30px;border-radius:8px;display:flex;align-items:center;padding:0 11px;color:#fff;font-size:12.5px;font-weight:700;min-width:44px}
/* trend area */
.trend-svg{width:100%;height:190px;display:block}
.mini-legend{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.mini-legend span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mini-legend .dt{width:10px;height:3px;border-radius:2px}
/* recent list */
.recent{display:flex;flex-direction:column}
.recent .ri{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.recent .ri:last-child{border-bottom:none}
.recent .av-lead{width:34px;height:34px;font-size:12.5px;border-radius:10px}
.recent .ri .info{flex:1;min-width:0}
.recent .ri .info b{font-size:13px;font-weight:700;display:block}
.recent .ri .info span{font-size:11.5px;color:var(--muted)}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--ink-2);font-weight:600;font-size:13px;padding:4px 0;margin-bottom:16px}
.back:hover{color:var(--accent)}
.back svg{width:16px;height:16px}
.detail-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.profile{padding:22px;text-align:center}
.profile .av-big{width:84px;height:84px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:30px}
.profile h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}
.profile .p-sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.p-contact{display:flex;flex-direction:column;gap:8px;margin:16px 0;text-align:left}
.p-contact div{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);padding:9px 12px;background:var(--surface-2);border-radius:9px}
.p-contact svg{width:15px;height:15px;color:var(--accent)}
.act-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.act-btns .full{grid-column:1/-1}
.a-call{background:var(--good);border-color:var(--good);color:#fff}.a-call:hover{background:#12833c;color:#fff}
.a-wa{background:#1FA855;border-color:#1FA855;color:#fff}.a-wa:hover{background:#178943;color:#fff}
.qstats{border-top:1px solid var(--line-2);padding-top:14px;text-align:left}
.qstats .qs-h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:10px}
.qs-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px}
.qs-row span{color:var(--muted)}.qs-row b{font-weight:700}
.panel{padding:20px 22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel-head h3{margin:0;font-size:15px;font-weight:700}
.section-t{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin:22px 0 12px}
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-item .dot{position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);
  border:3px solid var(--accent);box-shadow:0 0 0 3px var(--surface)}
.tl-item.g .dot{border-color:var(--good)}.tl-item.a .dot{border-color:var(--warn)}
.tl-item h4{margin:0;font-size:13.5px;font-weight:700}
.tl-item p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.tl-item time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.note-box{margin-top:12px;border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--surface-2)}
.note-box textarea{width:100%;border:none;background:none;resize:vertical;min-height:52px;font-family:inherit;font-size:13px;color:var(--ink)}
.note-box textarea:focus{outline:none}
.note-box .nb-foot{display:flex;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--line-2)}

.demo-note{margin:0 0 18px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  color:var(--ink);border-radius:11px;padding:11px 15px;font-size:12.5px;display:flex;gap:9px;align-items:center}
.demo-note svg{width:17px;height:17px;color:var(--warn);flex:none}
.hide{display:none!important}
.scrim{display:none}
@media(max-width:960px){
  .dash-grid,.dash-grid-3{grid-template-columns:1fr}
}
@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:262px;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  .app.nav-open .sidebar{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,12,22,.5);z-index:35}
  .hamb{display:inline-flex}
  .kpis{grid-template-columns:1fr 1fr}
  .detail-grid{grid-template-columns:1fr}
  .content{padding:18px 16px 40px}
  .topbar{padding:11px 16px}
  .search{max-width:none}
  .pill-user .u-txt{display:none}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .k-num{font-size:23px}
  table,thead,tbody,th,td,tr{display:block}
  thead{display:none}
  table{min-width:0}
  tbody tr{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:6px 4px;background:var(--surface)}
  td{padding:8px 14px;border:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
  td::before{content:attr(data-l);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  td.td-lead::before{display:none}
  td.td-lead{border-bottom:1px solid var(--line-2);padding-bottom:11px;margin-bottom:3px}
  .req{max-width:60%;text-align:right}
  .prog{min-width:0;width:55%}
  .sbar .row{grid-template-columns:100px 1fr 36px}
}
